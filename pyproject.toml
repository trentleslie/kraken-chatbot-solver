[project]
name = "kraken-asta-solver"
version = "0.1.0"
description = "KRAKEN discovery pipeline as an Inspect AI solver for AstaBench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai==0.3.114",
    "langgraph>=0.2.0",
    "kestrel-backend",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
kestrel-backend = { path = "../kraken-chatbot/backend", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kraken_solver"]
